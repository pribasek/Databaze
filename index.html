<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD Databáze - Los Santos</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #login-screen, #database-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            border-top: 5px solid #0056b3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        #database-content { display: none; width: 90%; max-width: 1000px; height: 80vh; overflow-y: auto; }
        
        /* Navigace */
        .nav-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .nav-item {
            padding: 10px 15px;
            background: #222;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .nav-item:hover { background: #333; }
        
        /* Speciální sekce pro detektivy */
        #detective-only {
            display: none; /* Defaultně skryto */
            border: 1px solid #e74c3c;
            padding: 10px;
            background: rgba(231, 76, 60, 0.1);
        }

        h1 { color: #0056b3; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
        }
        .error { color: #ff4d4d; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="font-size: 50px;">🚔</div>
        <h1>LSPD INTRANET</h1>
        <input type="password" id="passwordField" placeholder="Služební heslo">
        <button onclick="checkPassword()">VSTOUPIT</button>
        <p id="errorMsg" class="error">Přístup odepřen!</p>
    </div>

    <div id="database-content">
        <div style="display: flex; justify-content: space-between;">
            <h2 id="welcome-msg">Vítejte v systému</h2>
            <button onclick="logout()" style="width: auto; background: #444;">Odhlásit</button>
        </div>

        <div class="nav-menu">
            <div class="nav-item">📋 Nástěnka</div>
            <div class="nav-item">👮 Uniformy</div>
            <div class="nav-item">🚔 Vozidla</div>
            <div id="detective-link" class="nav-item" style="display: none; color: #e74c3c; font-weight: bold;">🕵️ Vyšetřování</div>
        </div>

        <div id="main-section">
            <h3>Aktuální hlášení</h3>
            <p>Všechny hlídky v pohotovosti. Kód 3 v oblasti Mission Row.</p>
        </div>

        <div id="detective-only">
            <h3>Tajné spisy: Operace Underworld</h3>
            <p>Tato sekce je přístupná pouze pro detektivní oddělení.</p>
        </div>
    </div>

    <script>
        // DATABÁZE UŽIVATELŮ A HESEL
        const USERS = {
            "david": { name: "David", role: "officer" },
            "detektiv123": { name: "Detektiv Novák", role: "detective" },
            "admin": { name: "Chief of Police", role: "detective" }
        };

        function checkPassword() {
            const pass = document.getElementById('passwordField').value;
            const user = USERS[pass];

            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('database-content').style.display = 'block';
                document.getElementById('welcome-msg').innerText = "Vítejte, " + user.name;

                // Rozlišení rolí
                if (user.role === "detective") {
                    document.getElementById('detective-link').style.display = 'block';
                    document.getElementById('detective-only').style.display = 'block';
                }
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
