<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSPD Databáze - Los Santos</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #login-screen, #database-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            border-top: 5px solid #0056b3;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        #database-content { display: none; width: 80%; max-width: 800px; }
        h1 { color: #0056b3; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background: #004494; }
        .badge { font-size: 50px; margin-bottom: 10px; }
        .error { color: #ff4d4d; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="badge">🚔</div>
        <h1>LSPD INTRANET</h1>
        <p>Autorizovaný přístup pouze</p>
        <input type="password" id="passwordField" placeholder="Zadejte služební heslo">
        <button onclick="checkPassword()">VSTOUPIT</button>
        <p id="errorMsg" class="error">Neplatné heslo! Přístup odepřen.</p>
    </div>

    <div id="database-content">
        <h1>Databáze LSPD</h1>
        <p>Vítejte v systému.</p>
        <hr style="border: 0.5px solid #333;">
        <div style="text-align: left; margin-top: 20px;">
            <h3>Poslední záznamy:</h3>
            <ul>
                <li>Žádné záznamy k zobrazení.</li>
            </ul>
        </div>
        <button onclick="logout()" style="margin-top: 20px; background: #444;">Odhlásit se</button>
    </div>

    <script>
        // TADY NASTAVÍTE HESLO
        const SECRET_PASSWORD = "david"; 

        function checkPassword() {
            const input = document.getElementById('passwordField').value;
            const error = document.getElementById('errorMsg');

            if (input === SECRET_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('database-content').style.display = 'block';
            } else {
                error.style.display = 'block';
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
